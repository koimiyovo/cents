name: Frankfurter check

# Calls the real Frankfurter API with the app's own client and parser. A failure means the service changed
# (format, currencies, availability): GitHub emails the failure. Scheduled runs only happen on the default branch.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The environment variable is not a Gradle input, so the test task is cleaned first or it could be
      # skipped as up to date.
      - name: Ask the real API
        env:
          FRANKFURTER_LIVE: '1'
        run: ./gradlew :infrastructure:cleanTestDebugUnitTest :infrastructure:testDebugUnitTest --tests "*FrankfurterLiveTest"
